<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Películas Favoritas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6200ee;
            --primary-dark: #4a00b8;
            --secondary: #29b6f6;
            --secondary-dark: #1a8cc4;
            --background: #0f0f1e;
            --surface: #1a1a2e;
            --surface-light: #252538;
            --text: #ffffff;
            --text-secondary: #b8b8d1;
            --accent: #ff6b6b;
            --success: #4caf50;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #1a1a3e 100%);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        
        h1 {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 28px;
            letter-spacing: 2px;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 20px var(--shadow);
            position: relative;
            overflow: hidden;
        }
        
        h1::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shine 3s ease-in-out infinite;
        }
        
        @keyframes shine {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(50%, 50%); }
        }
        
        h2 { 
            margin-block-start: 0;
            margin-block-end: 20px;
            font-size: 24px;
            color: var(--secondary);
            font-weight: 600;
        }
        
        div#main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        button { 
            -webkit-font-smoothing: antialiased;
            display: inline-block;
            text-decoration: none;
            margin: 4px;
            color: white;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            height: 36px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(98, 0, 238, 0.3);
            letter-spacing: 0.5px;
        }
        
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(98, 0, 238, 0.5);
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.delete {
            background: linear-gradient(135deg, var(--accent) 0%, #d63031 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        button.delete:hover {
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.5);
        }
        
        button.new, button.search, button.reset {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
            box-shadow: 0 4px 15px rgba(41, 182, 246, 0.3);
            padding: 0 30px;
            height: 42px;
            font-size: 13px;
        }
        
        button.new:hover, button.search:hover, button.reset:hover {
            box-shadow: 0 6px 25px rgba(41, 182, 246, 0.5);
        }
        
        input {
            margin-bottom: 10px;
            margin-top: 5px;
            padding: 12px 16px;
            font-size: 14px;
            border: 2px solid var(--surface-light);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(98, 0, 238, 0.1);
        }
        
        div.actions { 
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        div.movie {
            display: inline-block;
            width: 240px;
            background: var(--surface);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 32px var(--shadow);
            margin: 15px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        div.movie:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 48px rgba(98, 0, 238, 0.4);
            border-color: var(--primary);
        }
        
        div.movie div.movie-img {
            width: 100%;
            height: 340px;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            background: var(--surface-light);
            position: relative;
        }
        
        div.movie div.movie-img::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.7) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        div.movie:hover div.movie-img::after {
            opacity: 1;
        }
        
        div.movie div.movie-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        div.movie:hover div.movie-img img {
            transform: scale(1.05);
        }
        
        div.movie div.title {
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 16px;
            font-weight: 600;
            margin-top: 12px;
            color: var(--text);
        }
        
        div.movie div.actions {
            margin-top: 12px;
            justify-content: center;
        }
        
        div.field {
            color: var(--secondary);
            text-transform: uppercase;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 22px;
                padding: 20px 15px;
            }
            
            div#main {
                padding: 20px 10px;
            }
            
            div.movie {
                width: calc(50% - 20px);
                margin: 10px;
            }
        }
        
        @media (max-width: 480px) {
            div.movie {
                width: calc(100% - 20px);
            }
        }
    </style>
</head>
<body>
    <h1>Mis Películas Favoritas</h1>
    <div id="main"> 
      <!-- Aquí puedes poner contenido estático o HTML generado manualmente -->
      <div class="movie">
        <div class="movie-img">
          <img src="files/superlopez.svg" alt="Superlópez" onerror="this.src='files/placeholder.svg'"/>
        </div>
        <div class="title">Superlópez</div>
        <div class="actions">
          <button>editar</button>
        </div>
      </div>
      <div class="movie">
        <div class="movie-img">
          <img src="files/jurassicpark.svg" alt="Jurassic Park" onerror="this.src='files/placeholder.svg'"/>
        </div>
        <div class="title">Jurassic Park</div>
        <div class="actions">
          <button>editar</button>
        </div>
      </div>
      <div class="movie">
        <div class="movie-img">
          <img src="files/interstellar.svg" alt="Interstellar" onerror="this.src='files/placeholder.svg'"/>
        </div>
        <div class="title">Interstellar</div>
        <div class="actions">
          <button>editar</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
